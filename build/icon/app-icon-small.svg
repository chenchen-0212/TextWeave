<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!--
    文织 TextWeave 应用图标 · 简化版（24 网格，用于 24px 及以下）

    完整版的「两张后卡竖杠 + 三条文字」在 16px 下会糊成一团白色，
    因此小尺寸改用一张更大的卡片 + 两条更粗更疏的文字线。
    这是专业图标集的通行做法：小尺寸单独出图，而不是把大图缩下去。
  -->
  <defs>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="24" height="24">
      <rect x="0" y="0" width="24" height="24" fill="#fff" stroke="none"/>
      <rect x="7" y="8.4" width="10" height="2.6" rx="1.3" fill="#000" stroke="none"/>
      <rect x="7" y="13" width="6.8" height="2.6" rx="1.3" fill="#000" stroke="none"/>
    </mask>
  </defs>

  <rect x="3.5" y="3" width="17" height="18" rx="3.2" fill="#ffffff" stroke="none" mask="url(#cut)"/>
</svg>
